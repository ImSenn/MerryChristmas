<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Christmas</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #0f0a08 0%, #3d2517 40%, #1a0f0a 100%);
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive, sans-serif;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #message-container {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
            width: 100%;
        }

        h1 {
            color: #FFF8DC;
            font-size: 3em;
            text-shadow: 0px 0px 5px #FFFFFF,
                         0px 0px 15px #FFD700,
                         0px 0px 25px #DAA520;
            margin: 0;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 3s ease-in-out;
        }

        h1.show {
            opacity: 1;
            animation: sparkleText 3s infinite alternate;
        }

        @keyframes sparkleText {
            0% {
                text-shadow: 0px 0px 5px #FFFFFF,
                             0px 0px 15px #FFD700;
            }
            100% {
                text-shadow: 0px 0px 10px #FFFFFF,
                             0px 0px 20px #FFD700,
                             0px 0px 30px #DAA520;
            }
        }
    </style>
</head>
<body>
    <div id="message-container">
        <h1 id="merry-text">Merry Christmas</h1>
    </div>

    <canvas id="canvas"></canvas>

    <audio id = "christmas-music" loop preload="auto" playsinline autoplay muted>
        <source src = "We Wish You a Merry Christmas.mp3"
                type = "audio/mpeg">
    </audio>
    
    <button id = "music-toggle"
            style = "position: fixed; bottom: 20px; left: 20px; z-index: 100; padding: 10px 20px; background: rgba(220, 20, 60, 0.8); color: white; border: 2px solid #FFD700; border-radius: 25px; cursor: pointer; font-family: inherit; font-size: 16px; box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); transition: all 0.3s;">
    </button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        const messageElement = document.getElementById('merry-text');
        const music = document.getElementById('christmas-music');
        const musicToggle = document.getElementById('music-toggle');

        music.volume = 0.6;


        const setButtonPlaying = (playing) => {
            musicToggle.textContent = playing ? '🔊 On' : '🔇 Off';
        };

        const tryPlay = async () => {
            try {
                await music.play();
                setButtonPlaying(!music.muted && !music.paused);
            } catch (e) {
                setButtonPlaying(false);
            }
        };
        
        let hasInteracted = false;
        const onFirstInteraction = async () => {
            if (hasInteracted) return;
            hasInteracted = true;
            music.muted = false;
            await tryPlay();
        };

        setButtonPlaying(false);

        window.addEventListener('load', () => {
            music.muted = true;
            tryPlay();
        });
  
        document.addEventListener('click', onFirstInteraction, { once: true });

        musicToggle.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (!hasInteracted) {
                hasInteracted = true;
                music.muted = false;
            }
            if (music.paused) {
                await tryPlay();
            } else {
                music.pause();
                setButtonPlaying(false);
            }
        });

        music.addEventListener('play', () => setButtonPlaying(true));
        music.addEventListener('pause', () => setButtonPlaying(false));

        let w, h;
        const particles = [];
        const particlesCount = 4000;
        const snowflakes = [];
        let santaX = -200;
        let santaY = 120;
        let santaSpeed = 3.75;
        
        const santaImg = new Image();
        santaImg.src = '8027806-removebg-preview.png';
        let santaLoaded = false;
        santaImg.onload = () => { santaLoaded = true; };

        const config = {
            treeWidth: 350,
            treeHeight: 650,
            layers: 9,
            spinSpeed: 0.005,
            fallChance: 0.002,
            groundLevel: 350    
        };

        const colors = [
            {r: 255, g: 215, b: 0},
            {r: 255, g: 255, b: 255},
            {r: 255, g: 230, b: 230},
            {r: 220, g: 20, b: 60}
        ];

        const ornamentColors = [
            {r: 220, g: 20, b: 60},
            {r: 255, g: 215, b: 0},
            {r: 40, g: 160, b: 60},
            {r: 230, g: 230, b: 255}
        ];

        let revealY = 0;
        let isStarActive = false;
        let starTransition = 0;
        let isMessageShown = false;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            config.treeHeight = h * 0.85;
            config.treeWidth = Math.min(w, h) * 0.18; 
            config.groundLevel = config.treeWidth / 2 + 20;

            revealY = config.treeHeight / 2 + 150;
            isStarActive = false;
            starTransition = 0;

            isMessageShown = false;
            messageElement.classList.remove('show');
            
            if (particles.length > 0) {
                particles.forEach(p => p.reset(true));
            }
            
            snowflakes.forEach(s => s.reset());
        }
        window.addEventListener('resize', resize);

        function lerp(start, end, t) {
            return start * (1 - t) + end * t;
        }

        class Particle {
            constructor () {
                this.isOrnament = Math.random() < 0.008;
                this.reset(true);
            }

            reset(initial = false) {
                this.calculateLocalPosition();
                if (this.isOrnament) {
                    this.color = ornamentColors[Math.floor(Math.random() * ornamentColors.length)];
                    this.size = 5 + Math.random() * 4;
                    this.targetAlpha = 1.0; 
                } else {
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.size = 0.5 + Math.random() * 2;
                    this.targetAlpha = 0.6 + Math.random() * 0.4;
                }

                this.alpha = 0;
                this.fadeSpeed = 0.03 + Math.random() * 0.005;
                this.isFalling = false;
                this.isGrounded = false;
                this.groundLine = 300;
                this.fallSpeed = 2 + Math.random() * 2;
            }

            calculateLocalPosition() {
                const layerProcess = Math.random();
                let processIntLayer;

                if (this.isOrnament) {
                    processIntLayer = 0.7 + Math.random() * 0.3;
                } else {
                    processIntLayer = (layerProcess * config.layers) % 1;
                }

                let baseR = config.treeWidth * layerProcess * 0.5;
                let layerR = baseR * (0.3 + 2.0 * (1 + processIntLayer));
                const angle = Math.random() * Math.PI * 2;

                this.angle = angle;
                this.lx = Math.cos(angle) * layerR;
                this.ly = (layerProcess - 0.5) * config.treeHeight;
                this.lz = Math.sin(angle) * layerR;
            }

            update(time) {
                const currentAngle = this.angle + time * config.spinSpeed;
                const spiralOffset = Math.sin(currentAngle) * 60;
                const triggerPoint = revealY + spiralOffset;
                const canShow = this.ly > triggerPoint;

                if (canShow && this.alpha < this.targetAlpha && !this.isFalling) {
                    this.alpha += this.fadeSpeed;
                }

                if (this.isFalling) {
                    this.ly += this.fallSpeed;
                    this.lx += Math.sin(time * 0.01 + this.lz) * 0.2;
                    this.lz += Math.cos(time * 0.01 + this.lx) * 0.2;
                    if (this.ly >= config.groundLevel) {
                        this.ly = config.groundLevel;
                        this.isGrounded = true;
                        this.isFalling = false;
                        this.lx = (Math.random() - 0.5) * 5;
                        this.lz = (Math.random() - 0.5) * 5;
                    }
                } else if (this.isGrounded) {
                    this.groundLine--;
                    if (this.groundLine < 50) this.alpha -=0.02;
                    if (this.groundLine < 0 || this.alpha <= 0) {
                        this.reset();
                    }
                } else {
                    if (!this.isOrnament && canShow && this.alpha > 0.4 && Math.random() < config.fallChance) {
                        this.isFalling = true;
                    }
                }
            }

            draw (ctx, cx, cy, rot) {
                if (this.alpha <= 0) return;
                const rx = this.lx * Math.cos(rot) - this.lz * Math.sin(rot);
                const rz = this.lx * Math.sin(rot) + this.lz * Math.cos(rot);
                const fov = 350;
                const scale = fov / (fov + rz + 450);
                if (scale < 0) return;
                const x2d = cx + rx * scale;
                const y2d = cy + this.ly * scale;
                let size = this.size * scale;

                if (this.isOrnament) {
                    size *= 0.8;
                    ctx.save();
                    ctx.translate(x2d, y2d);

                    const grad = ctx.createRadialGradient(-size * 0.3, -size * 0.3, size * 0.1, 0, 0, size);
                    grad.addColorStop(0, `rgba(255, 255, 255, ${this.alpha})`);
                    grad.addColorStop(0.5, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha})`);
                    grad.addColorStop(1, `rgba(${this.color.r * 0.25}, ${this.color.g * 0.25}, ${this.color.b * 0.25}, ${this.alpha})`);

                    ctx.beginPath();
                    ctx.arc(0, 0, size, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.ellipse(-size * 0.35, -size * 0.35, size * 0.2, size * 0.12, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                    ctx.fill();

                    ctx.restore();
                } else {
                    if (this.isGrounded) size *= 1.2;
                    ctx.beginPath();
                    ctx.arc(x2d, y2d, size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha})`;
                    ctx.fill();
                }
            }
        }

        class Snowflake {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h - 20;
                this.size = 0.1 + Math.random() * 1;
                this.speed = 1 + Math.random() * 2;
                this.drift = Math.random() * 0.5 - 0.25;
                this.opacity = 0.6 + Math.random() * 0.4;
            }

            update() {
                this.y += this.speed;
                this.x += Math.sin(this.y * 0.02) * this.drift;
                
                if (this.y > h) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalCompositeOperation = 'source-over';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.shadowBlur = 5;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < particlesCount; i++) {
            particles.push(new Particle());
        }

        for (let i = 0; i < 500; i++) {
            snowflakes.push(new Snowflake());
        }

        resize();

        function drawStar(cx, cy, time) {
           const rot = -Math.PI / 2;
           const spikes = 5;
           const pulse = Math.sin(time * 0.05);
           const currentState = 1 + (pulse * 0.15 * starTransition);
           const outerRadius = 12 * currentState;
           const innerRadius = 6 * currentState;
           const fov = 350;
           const scale = fov / (fov + 0 + 450);
           const starY = cy + (-config.treeHeight / 2) * scale + 5;

           ctx.save();
           ctx.translate(cx, starY);
           ctx.rotate(Math.sin(time * 0.02) * 0.1);
           ctx.beginPath();
           for (let i = 0; i < spikes; i++) {
               let x = Math.cos(rot + i * Math.PI / spikes * 2) * outerRadius;
               let y = Math.sin(rot + i * Math.PI / spikes * 2) * outerRadius;
               ctx.lineTo(x, y);
               x = Math.cos(rot + i * Math.PI / spikes * 2 + Math.PI / spikes) * innerRadius;
               y = Math.sin(rot + i * Math.PI / spikes * 2 + Math.PI / spikes) * innerRadius;
               ctx.lineTo(x, y);
           }
           ctx.closePath();

           const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, outerRadius);

           const starR = 255, starG = 215, starB = 0;
           const endR = 255, endG = 69, endB = 0;
           
           const currentR = lerp(starR, endR, Math.sin(time * 0.05) * 0.5 + 0.5);
           const currentG = lerp(starG, endG, Math.sin(time * 0.05) * 0.5 + 0.5);
           const currentB = lerp(starB, endB, Math.sin(time * 0.05) * 0.5 + 0.5);

           gradient.addColorStop(0, '#fff');
           gradient.addColorStop(0.4, `rgb(${currentR}, ${currentG}, ${currentB})`);
           gradient.addColorStop(1, `rgba(${currentR}, ${currentG}, ${currentB}, 0)`);

           ctx.shadowBlur = 30 * starTransition;
           ctx.shadowColor = "#FFE570";
           ctx.fillStyle = gradient;
           ctx.fill();
           ctx.restore();
        }

        function drawMoon(cx, cy, rot, time) {
            const moonRadius = 60;
            const moonX = w - 120;
            const moonY = 100;

            ctx.save();
            
            ctx.shadowBlur = 40;
            ctx.shadowColor = 'rgba(255, 250, 205, 0.6)';
            
            const grad = ctx.createRadialGradient(
                moonX - moonRadius * 0.2, moonY - moonRadius * 0.2, moonRadius * 0.1,
                moonX, moonY, moonRadius
            );
            grad.addColorStop(0, 'rgba(255, 250, 205, 0.95)');
            grad.addColorStop(0.6, 'rgba(255, 250, 205, 0.9)');
            grad.addColorStop(1, 'rgba(230, 230, 180, 0.8)');
            
            ctx.beginPath();
            ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(moonX + moonRadius * 0.3, moonY - moonRadius * 0.2, moonRadius * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(255, 250, 205, 0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.restore();
        }

        function drawSanta(time) {
            if (!santaLoaded) return;
            
            ctx.save();
            
            santaX += santaSpeed;
            if (santaX > w + 200) {
                santaX = -200;
            }
            
            const bobbing = Math.sin(time * 0.1) * 28;
            const currentY = santaY + bobbing;
            
            const santaWidth = 180;
            const santaHeight = 180;
            ctx.drawImage(santaImg, santaX - santaWidth/2, currentY - santaHeight/2, santaWidth, santaHeight);
            
            ctx.restore();
        }

        let time = 0;
        function animate() {
            time++;
            const treeTop = -config.treeHeight / 2;
            const distanceToTop = revealY - treeTop;
            const totalDistance = config.treeHeight + 150;

            let process = Math.max(0, Math.min(1, distanceToTop / totalDistance));
            let currentSpeed = 2.5 + process * 8.0;

            if (revealY > treeTop - 50) {
                revealY -= currentSpeed;
            } else if (revealY <= treeTop + 50){
                isStarActive = true;
            } 
            
            if (isStarActive && starTransition < 1) {
                starTransition += 0.2;
                if (starTransition >= 1 && !isMessageShown) starTransition = 1;
            }
            
            if (starTransition >= 1 && !isMessageShown) {
                messageElement.classList.add('show');
                isMessageShown = true;
            }

            ctx.fillStyle = 'rgba(15, 10, 8, 0.5)';
            ctx.fillRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2 + 50;
            const rot = time * config.spinSpeed;

            ctx.globalCompositeOperation = 'source-over';
            drawMoon(cx, cy, rot, time);

            drawSanta(time);

            snowflakes.forEach(s => {
                s.update();
                s.draw();
            });

            ctx.globalCompositeOperation = 'lighter';
            particles.forEach(p => {
                p.update(time);
                p.draw(ctx, cx, cy, rot);
            });

            ctx.globalCompositeOperation = 'source-over';
            if (starTransition > 0) {
                drawStar(cx, cy, time);
            }

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
